font_family      Maple Mono NF
bold_font        auto
italic_font      auto
font_size        11.5

# colours: the active setup (theme/setups/<id>.json via theme/eva.nix)
include ~/.config/eva/current/kitty.conf

# translucent — Hyprland blurs the wallpaper behind it
background_opacity 0.86
window_padding_width 14
confirm_os_window_close 0

# a block cursor, like a HUD caret
cursor_shape block
cursor_blink_interval 0.6
cursor_trail 3
cursor_trail_decay 0.1 0.35

# the tab bar: slanted plates, numbered like the workspace cells
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2
tab_title_template " {fmt.bold}{index:02d}{fmt.nobold} {title} "
active_tab_font_style bold
inactive_tab_font_style normal

# thin lit edge between splits, like the HUD frames
window_border_width 1pt
draw_minimal_borders yes

url_style curly
enable_audio_bell no
visual_bell_duration 0.15
