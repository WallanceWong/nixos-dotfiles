font_family      Maple Mono NF
bold_font        auto
italic_font      auto
font_size        11.5

# colours are generated from theme/palette.json
include ~/.config/whisper/kitty-colors.conf

# translucent — Hyprland blurs the wallpaper behind it
background_opacity 0.86
window_padding_width 14
confirm_os_window_close 0

cursor_shape beam
cursor_beam_thickness 1.6
cursor_blink_interval 0.6
cursor_trail 3
cursor_trail_decay 0.1 0.35

tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style round
tab_title_template " {index} {title} "

url_style curly
enable_audio_bell no
visual_bell_duration 0.15
