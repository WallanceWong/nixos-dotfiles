# "Whisper" palette — hand-picked from wallpapers/wall.jpg
# (night sky over the city lights, the streetlamp and the railing's cream glow)

$crust    = rgb(030b12)   # darkest shadows (trees, road)
$mantle   = rgb(05131e)
$base     = rgb(071a28)   # deep night sky
$surface0 = rgb(0c2a3d)   # sky
$surface1 = rgb(13384e)
$surface2 = rgb(1d4a60)   # horizon haze
$overlay  = rgb(3f6e74)   # city glow, muted
$subtext  = rgb(9fb5bd)
$text     = rgb(e3e8e1)   # moonlight

$lamp     = rgb(f0e3a8)   # streetlamp / railing — primary accent
$lampdim  = rgb(c9b979)
$teal     = rgb(7fc3c6)   # city lights — secondary accent
$blue     = rgb(6d9fd1)   # denim, distant lights
$red      = rgb(e0786c)   # her shirt
$mustard  = rgb(e3b35c)   # her skirt
$green    = rgb(8fbf9a)   # lamplit bushes
$violet   = rgb(b69ad6)

# Same colours as bare hex, for places that want rgba() with alpha
$baseHex  = 071a28
$crustHex = 030b12
$lampHex  = f0e3a8
$tealHex  = 7fc3c6
$textHex  = e3e8e1
$surface1Hex = 13384e
