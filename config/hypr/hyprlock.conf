# eva — fallback lock screen (only if nerv-shell does not answer, see lock.sh)

source = ~/.config/eva/current/hypr.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/nixos-dotfiles/wallpapers/unit01/wall.jpg
    blur_passes = 2
    blur_size = 5
    brightness = 0.75
    vibrancy = 0.18
}

# time
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $accent
    font_size = 108
    font_family = Noto Serif CJK JP Black
    shadow_passes = 3
    shadow_size = 6
    shadow_color = $shadow
    position = 0, 230
    halign = center
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $text
    font_size = 18
    font_family = Barlow Semi Condensed
    shadow_passes = 2
    shadow_size = 4
    shadow_color = $shadow
    position = 0, 120
    halign = center
    valign = center
}

# greeting that follows the hour
label {
    monitor =
    text = cmd[update:60000] h=$(date +%-H); if [ $h -lt 5 ]; then t="still awake"; elif [ $h -lt 12 ]; then t="good morning"; elif [ $h -lt 18 ]; then t="good afternoon"; else t="good evening"; fi; echo "$t, $USER"
    color = $subtext
    font_size = 13
    font_family = Barlow Semi Condensed
    position = 0, -40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 54
    outline_thickness = 2
    outer_color = $accent $armour 45deg
    inner_color = $shadow
    font_color = $text
    check_color = $armour
    fail_color = $alert
    capslock_color = $caution
    fade_on_empty = false
    rounding = -1
    dots_size = 0.22
    dots_spacing = 0.35
    placeholder_text = <span foreground="##9fb5bd">󰌾  password</span>
    fail_text = <span foreground="##ff5d73">ACCESS DENIED · 否決</span>
    position = 0, -110
    halign = center
    valign = center
}

# 逃げちゃダメだ — "I mustn't run away"
label {
    monitor =
    text = 逃げちゃダメだ
    color = $subtext
    font_size = 14
    font_family = Noto Serif CJK JP Black
    position = 0, 40
    halign = center
    valign = bottom
}
