# whisper — lock screen: the same night, softly out of focus

source = ~/.config/hypr/colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/nixos-dotfiles/wallpapers/wall.jpg
    blur_passes = 2
    blur_size = 5
    brightness = 0.75
    vibrancy = 0.18
}

# time
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $lamp
    font_size = 108
    font_family = JetBrainsMono Nerd Font ExtraBold
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(030b12cc)
    position = 0, 230
    halign = center
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $text
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(030b12cc)
    position = 0, 120
    halign = center
    valign = center
}

# greeting that follows the hour
label {
    monitor =
    text = cmd[update:60000] h=$(date +%-H); if [ $h -lt 5 ]; then t="still awake"; elif [ $h -lt 12 ]; then t="good morning"; elif [ $h -lt 18 ]; then t="good afternoon"; else t="good evening"; fi; echo "$t, $USER"
    color = $subtext
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, -40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 54
    outline_thickness = 2
    outer_color = $lamp $teal 45deg
    inner_color = rgba(071a28cc)
    font_color = $text
    check_color = $teal
    fail_color = $red
    capslock_color = $mustard
    fade_on_empty = false
    rounding = -1
    dots_size = 0.22
    dots_spacing = 0.35
    placeholder_text = <span foreground="##9fb5bd">󰌾  password</span>
    fail_text = <span foreground="##e0786c">not quite — try again</span>
    position = 0, -110
    halign = center
    valign = center
}

# 耳をすませば — "Whisper of the Heart"
label {
    monitor =
    text = 耳をすませば
    color = rgba(e3e8e199)
    font_size = 14
    font_family = Noto Sans CJK JP
    position = 0, 40
    halign = center
    valign = bottom
}
