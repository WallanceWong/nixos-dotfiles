#  ╭──────────────────────────────────────────────────────────────╮
#  │  whisper — a quiet night over the city lights                │
#  ╰──────────────────────────────────────────────────────────────╯

monitor = , preferred, auto, 1

# colours are generated from theme/palette.json by theme/whisper.nix
source = ~/.config/whisper/hypr-colors.conf

# ── autostart ────────────────────────────────────────────────────
# The desktop itself — living wallpaper, bar, notifications, panels — is
# whisper-shell (Quickshell), a systemd user service that starts with the
# session target below. Super+Ctrl+R restarts it; Super+Ctrl+B falls back to
# the old waybar setup if it ever breaks.
exec-once = wl-paste --watch cliphist store
exec-once = fcitx5 -d -r
# Start systemd's graphical session (needed by xdg-desktop-portal and hypridle.service)
exec-once = dbus-update-activation-environment --systemd DISPLAY HYPRLAND_INSTANCE_SIGNATURE WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE && systemctl --user stop hyprland-session.target; systemctl --user start hyprland-session.target
# Autologin skips the password, so lock once at login. Unlocking also unlocks the
# keyring, but only once its components are initialised, so start them first.
exec-once = gnome-keyring-daemon --start --components=secrets,pkcs11 > /dev/null; ~/nixos-dotfiles/config/hypr/lock.sh login

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# ── input ────────────────────────────────────────────────────────
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
    }
}

gesture = 3, horizontal, workspace
gesture = 3, up, dispatcher, global, quickshell:overview

# ── look ─────────────────────────────────────────────────────────
general {
    gaps_in = 6
    gaps_out = 14
    border_size = 2
    # streetlamp cream fading into the city's teal glow
    col.active_border = $lamp $teal 45deg
    col.inactive_border = $inactiveBorder
    resize_on_border = true
    layout = dwindle
    # lets games skip vsync for lower input lag (only windows with "immediate")
    allow_tearing = true
}

decoration {
    rounding = 14
    active_opacity = 1.0
    inactive_opacity = 0.96
    dim_inactive = true
    dim_strength = 0.05

    blur {
        enabled = true
        size = 7
        passes = 3
        vibrancy = 0.2
        noise = 0.015
        popups = true
    }

    shadow {
        enabled = true
        range = 22
        render_power = 3
        color = $shadow
    }
}

animations {
    enabled = true
    # slow, soft easing — nothing snaps, things drift in like night air
    bezier = drift, 0.22, 1, 0.36, 1
    bezier = settle, 0.05, 0.9, 0.1, 1.02
    bezier = linear, 0, 0, 1, 1

    animation = windows, 1, 5, settle, popin 88%
    animation = windowsOut, 1, 4, drift, popin 88%
    animation = fade, 1, 5, drift
    animation = border, 1, 8, drift
    # the border gradient slowly turns, like lights shimmering far away
    animation = borderangle, 1, 120, linear, loop
    animation = layers, 1, 4, drift, fade
    animation = workspaces, 1, 5, drift, slidefade 12%
    animation = specialWorkspace, 1, 5, drift, slidevert
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    background_color = $crust
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    # If the lock screen ever crashes, a restarted shell (or hyprlock) can take over
    allow_session_lock_restore = true
}

cursor {
    inactive_timeout = 8
}

# ── rules ────────────────────────────────────────────────────────
windowrule = match:class ^(blueman-manager)$, float on, size 720 480, center on
windowrule = match:class ^(nm-connection-editor)$, float on, center on
windowrule = match:class ^(org.pulseaudio.pavucontrol)$, float on, size 760 520, center on
windowrule = match:class ^(mpv)$, float on, center on
windowrule = match:title ^(File Operation Progress)$, float on
windowrule = match:class ^(xdg-desktop-portal-gtk)$, float on, center on
windowrule = match:class .*, idle_inhibit fullscreen

# game mode for Roblox (Sober): no effects, and tearing allowed for lower latency
windowrule = match:class ^(org.vinegarhq.Sober)$, immediate on, no_blur on, no_anim on, no_shadow on, no_dim on

# scratch terminal that drops in over everything (Super + `)
workspace = special:term, on-created-empty:kitty --class scratch
windowrule = match:class ^(scratch)$, float on, size (monitor_w*0.66) (monitor_h*0.6), center on, suppress_event maximize fullscreen

# frosted glass behind every whisper-shell surface (not the wallpaper itself)
layerrule = match:namespace ^(whisper-(bar|control|dashboard|launcher|notifications|osd|overview|power|polkit|cheatsheet|settings))$, blur on, ignore_alpha 0.2
# fallback setup (Super+Ctrl+B)
layerrule = match:namespace ^(waybar|rofi|notifications|logout_dialog)$, blur on, ignore_alpha 0.2

# ── keys ─────────────────────────────────────────────────────────
$mainMod = SUPER
bindd = $mainMod, Q, Terminal, exec, kitty
bindd = $mainMod, C, Close window, killactive
bindd = $mainMod, M, Log out (quit Hyprland), exit
bindd = $mainMod, E, Files, exec, thunar
bindd = $mainMod, V, Float / tile window, togglefloating
bindd = $mainMod, R, App launcher, global, quickshell:launcher
bindd = $mainMod, SPACE, App launcher, global, quickshell:launcher
bindd = $mainMod, P, Pseudo-tile window, pseudo
bindd = $mainMod, J, Flip split direction, layoutmsg, togglesplit
bindd = $mainMod, F, Fullscreen, fullscreen
bindd = $mainMod, L, Lock screen, exec, ~/nixos-dotfiles/config/hypr/lock.sh
bindd = $mainMod, ESCAPE, Power menu, global, quickshell:power
bindd = $mainMod, TAB, Workspace overview, global, quickshell:overview
bindd = $mainMod SHIFT, TAB, Previous workspace, workspace, previous
bindd = $mainMod, grave, Drop-down terminal, togglespecialworkspace, term
bindd = $mainMod, W, Window switcher, global, quickshell:windows
bindd = $mainMod SHIFT, V, Clipboard history, global, quickshell:clipboard
bindd = $mainMod, PERIOD, Emoji picker, global, quickshell:emoji
bindd = $mainMod, N, Control centre, global, quickshell:control
bindd = $mainMod SHIFT, N, Do not disturb, global, quickshell:dnd
bindd = $mainMod, D, Dashboard, global, quickshell:dashboard
bindd = $mainMod, G, Game mode, global, quickshell:gamemode
bindd = $mainMod, SLASH, Keyboard shortcuts, global, quickshell:cheatsheet
bindd = $mainMod, COMMA, whisper settings, global, quickshell:settings

# recording, drawing on screenshots, colour picker
bindd = $mainMod SHIFT, R, Record a region, global, quickshell:record
bindd = $mainMod ALT, R, Record the whole screen, global, quickshell:recordscreen
bindd = $mainMod SHIFT, A, Draw on a screenshot, exec, ~/nixos-dotfiles/config/hypr/annotate.sh
bindd = $mainMod SHIFT, C, Pick a colour, exec, ~/nixos-dotfiles/config/hypr/picker.sh

# shell rescue: restart it, or fall back to the old waybar setup
bindd = $mainMod CTRL, R, Restart the shell, exec, systemctl --user restart whisper-shell
bindd = $mainMod CTRL, B, Fallback desktop (waybar), exec, systemctl --user stop whisper-shell; hyprpaper & waybar & mako & /run/current-system/sw/libexec/hyprpolkitagent &

bindd = $mainMod, left, Focus window, movefocus, l
bindd = $mainMod, right, Focus window, movefocus, r
bindd = $mainMod, up, Focus window, movefocus, u
bindd = $mainMod, down, Focus window, movefocus, d
bindd = $mainMod SHIFT, left, Move window, movewindow, l
bindd = $mainMod SHIFT, right, Move window, movewindow, r
bindd = $mainMod SHIFT, up, Move window, movewindow, u
bindd = $mainMod SHIFT, down, Move window, movewindow, d

bindd = $mainMod, 1, Go to workspace, workspace, 1
bindd = $mainMod, 2, Go to workspace, workspace, 2
bindd = $mainMod, 3, Go to workspace, workspace, 3
bindd = $mainMod, 4, Go to workspace, workspace, 4
bindd = $mainMod, 5, Go to workspace, workspace, 5
bindd = $mainMod SHIFT, 1, Move window to workspace, movetoworkspace, 1
bindd = $mainMod SHIFT, 2, Move window to workspace, movetoworkspace, 2
bindd = $mainMod SHIFT, 3, Move window to workspace, movetoworkspace, 3
bindd = $mainMod SHIFT, 4, Move window to workspace, movetoworkspace, 4
bindd = $mainMod SHIFT, 5, Move window to workspace, movetoworkspace, 5
bindd = $mainMod, mouse_down, Next workspace, workspace, e+1
bindd = $mainMod, mouse_up, Previous workspace, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Volume and brightness keys (e = repeat when held, l = work while locked).
# whisper-shell shows the popup: it watches the volume itself, and is told
# about brightness through the extra "global" bind.
binddel = , XF86AudioRaiseVolume, Volume up, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0; wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
binddel = , XF86AudioLowerVolume, Volume down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
binddl = , XF86AudioMute, Mute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
binddl = , XF86AudioMicMute, Mute microphone, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
binddel = , XF86MonBrightnessUp, Brightness up, exec, brightnessctl -q set 5%+
bindel = , XF86MonBrightnessUp, global, quickshell:brightness
binddel = , XF86MonBrightnessDown, Brightness down, exec, brightnessctl -q set 5%-
bindel = , XF86MonBrightnessDown, global, quickshell:brightness
binddl = , XF86AudioPlay, Play / pause, exec, playerctl play-pause
binddl = , XF86AudioNext, Next track, exec, playerctl next
binddl = , XF86AudioPrev, Previous track, exec, playerctl previous

# Screenshots: saved to ~/Pictures/Screenshots and copied to clipboard
bindd = , Print, Screenshot (whole screen), exec, ~/nixos-dotfiles/config/hypr/screenshot.sh full
bindd = SHIFT, Print, Screenshot (region), exec, ~/nixos-dotfiles/config/hypr/screenshot.sh region
bindd = $mainMod SHIFT, S, Screenshot (region), exec, ~/nixos-dotfiles/config/hypr/screenshot.sh region
