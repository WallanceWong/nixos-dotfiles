#  ╭──────────────────────────────────────────────────────────────╮
#  │  whisper — a quiet night over the city lights                │
#  ╰──────────────────────────────────────────────────────────────╯

monitor = , preferred, auto, 1

# colours are generated from theme/palette.json by theme/whisper.nix
source = ~/.config/whisper/hypr-colors.conf

# ── autostart ────────────────────────────────────────────────────
# The desktop itself — living wallpaper, bar, notifications, panels — is
# whisper-shell (Quickshell), a systemd user service that starts with the
# session target below. Super+Ctrl+R restarts it; Super+Ctrl+B falls back to
# the old waybar setup if it ever breaks.
exec-once = wl-paste --watch cliphist store
exec-once = fcitx5 -d -r
# Start systemd's graphical session (needed by xdg-desktop-portal and hypridle.service)
exec-once = dbus-update-activation-environment --systemd DISPLAY HYPRLAND_INSTANCE_SIGNATURE WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE && systemctl --user stop hyprland-session.target; systemctl --user start hyprland-session.target
# Autologin skips the password, so lock once at login. Unlocking also unlocks the
# keyring, but only once its components are initialised, so start them first.
exec-once = gnome-keyring-daemon --start --components=secrets,pkcs11 > /dev/null; hyprlock

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# ── input ────────────────────────────────────────────────────────
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
    }
}

gesture = 3, horizontal, workspace
gesture = 3, up, dispatcher, global, quickshell:overview

# ── look ─────────────────────────────────────────────────────────
general {
    gaps_in = 6
    gaps_out = 14
    border_size = 2
    # streetlamp cream fading into the city's teal glow
    col.active_border = $lamp $teal 45deg
    col.inactive_border = $inactiveBorder
    resize_on_border = true
    layout = dwindle
    # lets games skip vsync for lower input lag (only windows with "immediate")
    allow_tearing = true
}

decoration {
    rounding = 14
    active_opacity = 1.0
    inactive_opacity = 0.96
    dim_inactive = true
    dim_strength = 0.05

    blur {
        enabled = true
        size = 7
        passes = 3
        vibrancy = 0.2
        noise = 0.015
        popups = true
    }

    shadow {
        enabled = true
        range = 22
        render_power = 3
        color = $shadow
    }
}

animations {
    enabled = true
    # slow, soft easing — nothing snaps, things drift in like night air
    bezier = drift, 0.22, 1, 0.36, 1
    bezier = settle, 0.05, 0.9, 0.1, 1.02
    bezier = linear, 0, 0, 1, 1

    animation = windows, 1, 5, settle, popin 88%
    animation = windowsOut, 1, 4, drift, popin 88%
    animation = fade, 1, 5, drift
    animation = border, 1, 8, drift
    # the border gradient slowly turns, like lights shimmering far away
    animation = borderangle, 1, 120, linear, loop
    animation = layers, 1, 4, drift, fade
    animation = workspaces, 1, 5, drift, slidefade 12%
    animation = specialWorkspace, 1, 5, drift, slidevert
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    background_color = $crust
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    # If hyprlock ever crashes, allow restarting it from a TTY instead of being stuck
    allow_session_lock_restore = true
}

cursor {
    inactive_timeout = 8
}

# ── rules ────────────────────────────────────────────────────────
windowrule = match:class ^(blueman-manager)$, float on, size 720 480, center on
windowrule = match:class ^(nm-connection-editor)$, float on, center on
windowrule = match:class ^(org.pulseaudio.pavucontrol)$, float on, size 760 520, center on
windowrule = match:class ^(mpv)$, float on, center on
windowrule = match:title ^(File Operation Progress)$, float on
windowrule = match:class ^(xdg-desktop-portal-gtk)$, float on, center on
windowrule = match:class .*, idle_inhibit fullscreen

# game mode for Roblox (Sober): no effects, and tearing allowed for lower latency
windowrule = match:class ^(org.vinegarhq.Sober)$, immediate on, no_blur on, no_anim on, no_shadow on, no_dim on

# scratch terminal that drops in over everything (Super + `)
workspace = special:term, on-created-empty:kitty --class scratch
windowrule = match:class ^(scratch)$, float on, size (monitor_w*0.66) (monitor_h*0.6), center on, suppress_event maximize fullscreen

# frosted glass behind every whisper-shell surface (not the wallpaper itself)
layerrule = match:namespace ^(whisper-(bar|control|dashboard|launcher|notifications|osd|overview|power|polkit))$, blur on, ignore_alpha 0.2
# fallback setup (Super+Ctrl+B)
layerrule = match:namespace ^(waybar|rofi|notifications|logout_dialog)$, blur on, ignore_alpha 0.2

# ── keys ─────────────────────────────────────────────────────────
$mainMod = SUPER
bind = $mainMod, Q, exec, kitty
bind = $mainMod, C, killactive
bind = $mainMod, M, exit
bind = $mainMod, E, exec, thunar
bind = $mainMod, V, togglefloating
bind = $mainMod, R, global, quickshell:launcher
bind = $mainMod, SPACE, global, quickshell:launcher
bind = $mainMod, P, pseudo
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod, F, fullscreen
bind = $mainMod, L, exec, pidof hyprlock || hyprlock
bind = $mainMod, ESCAPE, global, quickshell:power
bind = $mainMod, TAB, global, quickshell:overview
bind = $mainMod SHIFT, TAB, workspace, previous
bind = $mainMod, grave, togglespecialworkspace, term
bind = $mainMod, W, global, quickshell:windows
bind = $mainMod SHIFT, V, global, quickshell:clipboard
bind = $mainMod, PERIOD, global, quickshell:emoji
bind = $mainMod, N, global, quickshell:control
bind = $mainMod SHIFT, N, global, quickshell:dnd
bind = $mainMod, D, global, quickshell:dashboard
bind = $mainMod, G, global, quickshell:gamemode

# recording, drawing on screenshots, colour picker
bind = $mainMod SHIFT, R, global, quickshell:record
bind = $mainMod ALT, R, global, quickshell:recordscreen
bind = $mainMod SHIFT, A, exec, ~/nixos-dotfiles/config/hypr/annotate.sh
bind = $mainMod SHIFT, C, exec, ~/nixos-dotfiles/config/hypr/picker.sh

# shell rescue: restart it, or fall back to the old waybar setup
bind = $mainMod CTRL, R, exec, systemctl --user restart whisper-shell
bind = $mainMod CTRL, B, exec, systemctl --user stop whisper-shell; hyprpaper & waybar & mako & /run/current-system/sw/libexec/hyprpolkitagent &

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Volume and brightness keys (e = repeat when held, l = work while locked).
# whisper-shell shows the popup: it watches the volume itself, and is told
# about brightness through the extra "global" bind.
bindel = , XF86AudioRaiseVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0; wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl -q set 5%+
bindel = , XF86MonBrightnessUp, global, quickshell:brightness
bindel = , XF86MonBrightnessDown, exec, brightnessctl -q set 5%-
bindel = , XF86MonBrightnessDown, global, quickshell:brightness
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# Screenshots: saved to ~/Pictures/Screenshots and copied to clipboard
bind = , Print, exec, ~/nixos-dotfiles/config/hypr/screenshot.sh full
bind = SHIFT, Print, exec, ~/nixos-dotfiles/config/hypr/screenshot.sh region
bind = $mainMod SHIFT, S, exec, ~/nixos-dotfiles/config/hypr/screenshot.sh region
