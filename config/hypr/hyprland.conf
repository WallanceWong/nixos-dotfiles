#  ╭──────────────────────────────────────────────────────────────╮
#  │  whisper — a quiet night over the city lights                │
#  ╰──────────────────────────────────────────────────────────────╯

monitor = , preferred, auto, 1

source = ~/.config/hypr/colors.conf

# ── autostart ────────────────────────────────────────────────────
exec-once = hyprpaper
exec-once = waybar
exec-once = mako
exec-once = wl-paste --watch cliphist store
# Start systemd's graphical session (needed by xdg-desktop-portal and hypridle.service)
exec-once = dbus-update-activation-environment --systemd DISPLAY HYPRLAND_INSTANCE_SIGNATURE WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE && systemctl --user stop hyprland-session.target; systemctl --user start hyprland-session.target
exec-once = /run/current-system/sw/libexec/hyprpolkitagent
# Autologin skips the password, so lock once at login. Unlocking also unlocks the
# keyring, but only once its components are initialised, so start them first.
exec-once = gnome-keyring-daemon --start --components=secrets,pkcs11 > /dev/null; hyprlock

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# ── input ────────────────────────────────────────────────────────
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
    }
}

gesture = 3, horizontal, workspace

# ── look ─────────────────────────────────────────────────────────
general {
    gaps_in = 6
    gaps_out = 14
    border_size = 2
    # streetlamp cream fading into the city's teal glow
    col.active_border = $lamp $teal 45deg
    col.inactive_border = rgba(13384ecc)
    resize_on_border = true
    layout = dwindle
}

decoration {
    rounding = 14
    active_opacity = 1.0
    inactive_opacity = 0.96
    dim_inactive = true
    dim_strength = 0.05

    blur {
        enabled = true
        size = 7
        passes = 3
        vibrancy = 0.2
        noise = 0.015
        popups = true
    }

    shadow {
        enabled = true
        range = 22
        render_power = 3
        color = rgba(030b12bb)
    }
}

animations {
    enabled = true
    # slow, soft easing — nothing snaps, things drift in like night air
    bezier = drift, 0.22, 1, 0.36, 1
    bezier = settle, 0.05, 0.9, 0.1, 1.02
    bezier = linear, 0, 0, 1, 1

    animation = windows, 1, 5, settle, popin 88%
    animation = windowsOut, 1, 4, drift, popin 88%
    animation = fade, 1, 5, drift
    animation = border, 1, 8, drift
    # the border gradient slowly turns, like lights shimmering far away
    animation = borderangle, 1, 120, linear, loop
    animation = layers, 1, 4, drift, fade
    animation = workspaces, 1, 5, drift, slidefade 12%
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    background_color = $crust
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    # If hyprlock ever crashes, allow restarting it from a TTY instead of being stuck
    allow_session_lock_restore = true
}

cursor {
    inactive_timeout = 8
}

# ── rules ────────────────────────────────────────────────────────
windowrule = match:class ^(blueman-manager)$, float on, size 720 480, center on
windowrule = match:class ^(nm-connection-editor)$, float on, center on
windowrule = match:class ^(org.pulseaudio.pavucontrol)$, float on, size 760 520, center on
windowrule = match:class ^(mpv)$, float on, center on
windowrule = match:title ^(File Operation Progress)$, float on
windowrule = match:class ^(xdg-desktop-portal-gtk)$, float on, center on
windowrule = match:class .*, idle_inhibit fullscreen

layerrule = match:namespace waybar, blur on, ignore_alpha 0.2
layerrule = match:namespace rofi, blur on, ignore_alpha 0.2
layerrule = match:namespace notifications, blur on, ignore_alpha 0.2
layerrule = match:namespace logout_dialog, blur on

# ── keys ─────────────────────────────────────────────────────────
$mainMod = SUPER
bind = $mainMod, Q, exec, kitty
bind = $mainMod, C, killactive
bind = $mainMod, M, exit
bind = $mainMod, E, exec, thunar
bind = $mainMod, V, togglefloating
bind = $mainMod, R, exec, pkill rofi || rofi -show drun
bind = $mainMod, SPACE, exec, pkill rofi || rofi -show drun
bind = $mainMod, P, pseudo
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod, F, fullscreen
bind = $mainMod, L, exec, pidof hyprlock || hyprlock
bind = $mainMod, ESCAPE, exec, pkill wlogout || wlogout -b 5 -T 400 -B 400
bind = $mainMod, TAB, workspace, previous
bind = $mainMod, W, exec, pkill rofi || rofi -show window
bind = $mainMod SHIFT, V, exec, pkill rofi || cliphist list | rofi -dmenu -p "󰅌" -display-columns 2 | cliphist decode | wl-copy
bind = $mainMod, N, exec, makoctl restore
bind = $mainMod SHIFT, N, exec, makoctl dismiss --all

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Volume and brightness keys (e = repeat when held, l = work while locked);
# osd.sh changes the value and shows a progress popup
bindel = , XF86AudioRaiseVolume, exec, ~/nixos-dotfiles/config/hypr/osd.sh volume up
bindel = , XF86AudioLowerVolume, exec, ~/nixos-dotfiles/config/hypr/osd.sh volume down
bindl = , XF86AudioMute, exec, ~/nixos-dotfiles/config/hypr/osd.sh volume mute
bindl = , XF86AudioMicMute, exec, ~/nixos-dotfiles/config/hypr/osd.sh mic mute
bindel = , XF86MonBrightnessUp, exec, ~/nixos-dotfiles/config/hypr/osd.sh brightness up
bindel = , XF86MonBrightnessDown, exec, ~/nixos-dotfiles/config/hypr/osd.sh brightness down
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# Screenshots: saved to ~/Pictures/Screenshots and copied to clipboard
bind = , Print, exec, ~/nixos-dotfiles/config/hypr/screenshot.sh full
bind = SHIFT, Print, exec, ~/nixos-dotfiles/config/hypr/screenshot.sh region
bind = $mainMod SHIFT, S, exec, ~/nixos-dotfiles/config/hypr/screenshot.sh region
