monitor=,preferred,auto,1

source = ~/.cache/wal/colors-hyprland.conf

exec-once = wal -i ~/nixos-dotfiles/wallpapers/wall.jpg -n
exec-once = hyprpaper
exec-once = ~/nixos-dotfiles/config/hypr/set-wallpaper.sh
exec-once = waybar
exec-once = mako
exec-once = hypridle

env = XCURSOR_SIZE,24

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
	 natural_scroll = true
    }
    sensitivity = 0
}

gesture = 3, horizontal, workspace

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = $color6
    col.inactive_border = $color8
    layout = dwindle
}

decoration {
    rounding = 8
    blur {
	 enabled = true
	 size = 4
	 passes = 2 
    }
}

animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 5, myBezier
    animation = fade, 1, 5, default
    animation = workspaces, 1, 4, default
}

dwindle {
    preserve_split = true
}

$mainMod = SUPER
bind = $mainMod, Q, exec, kitty
bind = $mainMod, C, killactive
bind = $mainMod, M, exit
bind = $mainMod, E, exec, thunar
bind = $mainMod, V, togglefloating
bind = $mainMod, R, exec, rofi -show drun
bind = $mainMod, P, pseudo

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = $mainMod, F, fullscreen
bind = $mainMod, L, exec, pidof hyprlock || hyprlock

# Volume and brightness keys (e = repeat when held, l = work while locked)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Screenshots: saved to ~/Pictures/Screenshots and copied to clipboard
bind = , Print, exec, ~/nixos-dotfiles/config/hypr/screenshot.sh full
bind = SHIFT, Print, exec, ~/nixos-dotfiles/config/hypr/screenshot.sh region
bind = $mainMod SHIFT, S, exec, ~/nixos-dotfiles/config/hypr/screenshot.sh region

# If hyprlock ever crashes, allow restarting it from a TTY instead of being stuck
misc {
    allow_session_lock_restore = true
}
