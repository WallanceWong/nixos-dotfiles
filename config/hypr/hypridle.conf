general {
    lock_cmd = ~/nixos-dotfiles/config/hypr/lock.sh
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Screensaver after 2 minutes: the night fills the screen (whisper-shell);
# any input brings the desktop back
listener {
    timeout = 120
    on-timeout = /run/current-system/sw/bin/qs ipc call whisper screensaver
    on-resume = /run/current-system/sw/bin/qs ipc call whisper wake
}

# Dim the screen 30 seconds before locking, like a streetlamp fading;
# any input restores the previous brightness
listener {
    timeout = 270
    on-timeout = brightnessctl -s set 15%
    on-resume = brightnessctl -r
}

# Lock after 5 minutes idle
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Screen off 30 seconds after locking
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
